# Example GitHub Actions workflow for running self-hosted Renovate with the
# vendored-sources feature.
#
# The critical line is `RENOVATE_ALLOWED_COMMANDS`: self-hosted Renovate refuses
# to run any `postUpgradeTasks` command unless it matches an allow-list entry.
# The trailing `( .*)?$` permits the arguments the sync tool is invoked with
# (e.g. `--id <name>`); a bare `...\.py$` would block it.
name: Renovate

on:
  schedule:
    - cron: 0 3,9,15,21 * * *
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  renovate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run Renovate
        uses: renovatebot/github-action@v46.1.14
        env:
          RENOVATE_ALLOWED_COMMANDS: '["^python3 tools/sync-vendored\\.py( .*)?$"]'
          RENOVATE_REPOSITORIES: your-org/your-repo
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
        with:
          # Point at your repo config (the custom manager lives here).
          configurationFile: renovate.json
