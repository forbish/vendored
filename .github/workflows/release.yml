name: release

on:
    push:
        tags:
            - "v*"

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    verify:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
            - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
              with:
                  python-version: "3.14"
            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
              with:
                  node-version: "24"
            - name: Install test dependencies
              run: python3 -m pip install --upgrade pip==26.1.2 pytest==9.0.3
            - name: Run tests
              run: python3 -m pytest tests/ -q
            - name: Verify vendored files are in sync
              env:
                  GITHUB_TOKEN: ${{ github.token }}
              run: python3 tools/sync-vendored.py --check
            - name: Validate Renovate configs
              run: >-
                  npx --yes --package renovate@43.214.2 renovate-config-validator
                  .github/renovate.json5 default.json examples/renovate.json5
            - name: Lint install.sh
              run: docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck@sha256:bb596a0d169b85ddd81d8b6d3a2ff6d5baf5fca10b97f575ebc647c3dff62b3d install.sh tools/verify-release-artifacts.sh

    package:
        needs: verify
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            contents: write
            id-token: write
            attestations: write
        steps:
            - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
            - name: Build release artifacts
              run: |
                  mkdir -p dist
                  git archive --format=tar.gz --prefix="vendored-${GITHUB_REF_NAME#v}/" -o "dist/vendored-${GITHUB_REF_NAME}.tar.gz" HEAD
                  git archive --format=zip --prefix="vendored-${GITHUB_REF_NAME#v}/" -o "dist/vendored-${GITHUB_REF_NAME}.zip" HEAD
                  sha256sum "dist/vendored-${GITHUB_REF_NAME}.tar.gz" "dist/vendored-${GITHUB_REF_NAME}.zip" > dist/checksums.txt
            - name: Generate SBOM
              uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
              with:
                  path: .
                  format: spdx-json
                  output-file: dist/sbom.spdx.json
            - name: Attest checksums provenance
              uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
              with:
                  subject-path: dist/checksums.txt
            - name: Install cosign
              uses: sigstore/cosign-installer@f713795cb21599bc4e5c4b58cbad1da852d7eeb9 # v3
            - name: Sign checksums (keyless)
              env:
                  COSIGN_YES: "true"
              run: |
                  cosign sign-blob --yes --output-signature dist/checksums.txt.sig --output-certificate dist/checksums.txt.pem dist/checksums.txt
            - name: Verify release artifacts before publish
              run: |
                  chmod +x tools/verify-release-artifacts.sh
                  tools/verify-release-artifacts.sh --dir dist --repo "${{ github.repository }}" --tag "${{ github.ref_name }}" --skip-attestation
            - name: Publish GitHub release
              uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
              with:
                  generate_release_notes: true
                  files: |
                      dist/vendored-${{ github.ref_name }}.tar.gz
                      dist/vendored-${{ github.ref_name }}.zip
                      dist/checksums.txt
                      dist/checksums.txt.sig
                      dist/checksums.txt.pem
                      dist/sbom.spdx.json
